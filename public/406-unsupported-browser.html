<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Not Supported — Zoomora</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #FFFFFF;
      color: #0A0A0B;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .brand {
      height: 48px;
      width: auto;
      margin-bottom: 28px;
    }
    .code {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7E8189;
      margin: 0 0 10px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 12px;
      color: #0A0A0B;
    }
    p.lead {
      font-size: 14px;
      line-height: 1.6;
      color: #5B5E66;
      margin: 0;
    }
  </style>
</head>
<body>
  <!-- This file lives in public/406-unsupported-browser.html -->
  <div class="wrap">
    <div class="card">
      <img class="brand" src="/images/logo-transparent.png" alt="Zoomora">
      <p class="code">Error 406</p>
      <h1>Your browser isn't supported.</h1>
      <p class="lead">Please update to a recent version of Chrome, Safari, Firefox, or Edge to continue.</p>
    </div>
  </div>
</body>
</html>
