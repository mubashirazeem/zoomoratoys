<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found — Zoomora</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #FFFFFF;
      color: #0A0A0B;
      font-family: "Poppins", Arial, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .brand {
      height: 48px;
      width: auto;
      margin-bottom: 28px;
    }
    .code {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7E8189;
      margin: 0 0 10px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 12px;
      color: #0A0A0B;
    }
    p.lead {
      font-size: 14px;
      line-height: 1.6;
      color: #5B5E66;
      margin: 0 0 32px;
    }
    .btn {
      display: inline-block;
      padding: 13px 32px;
      border-radius: 9999px;
      background: linear-gradient(180deg, #E24450 0%, #C01827 60%, #94101C 100%);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 10px -3px rgba(192,24,39,0.55), 0 1px 2px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <!-- This file lives in public/404.html -->
  <div class="wrap">
    <div class="card">
      <img class="brand" src="/images/logo-transparent.png" alt="Zoomora">
      <p class="code">Error 404</p>
      <h1>This page took a wrong turn.</h1>
      <p class="lead">The page you're looking for may have moved, been renamed, or no longer exists. Let's get you back on track.</p>
      <a class="btn" href="/">Back to Homepage</a>
    </div>
  </div>
</body>
</html>
